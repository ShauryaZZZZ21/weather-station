<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmosphere OS | Live Telemetry</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --card-bg: rgba(10, 12, 18, 0.65); 
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            
            --sky-dawn: linear-gradient(135deg, #1a1a2e, #ff7e5f, #feb47b);
            --sky-day: linear-gradient(135deg, #2980b9, #6dd5fa, #ffffff);
            --sky-dusk: linear-gradient(135deg, #0f2027, #203a43, #ff4e50);
            --sky-night: linear-gradient(135deg, #050505, #0a0a12, #11111a);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { color: var(--text-primary); min-height: 100vh; overflow-x: hidden; transition: background 2s ease-in-out; background: var(--sky-night); }

        #skyCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

        .content-wrapper { position: relative; z-index: 10; width: 100%; max-width: 1100px; margin: 0 auto; padding: 3rem 2rem; display: flex; flex-direction: column; gap: 2rem; }

        .sky-banner { background: var(--card-bg); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid var(--card-border); border-radius: 24px; padding: 3rem; box-shadow: 0 20px 40px rgba(0,0,0,0.3); animation: fadeDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .sky-banner h1 { font-size: 3rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.5rem; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .sky-banner p { color: #cbd5e1; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        
        .ping { width: 10px; height: 10px; background-color: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981; animation: pulse 2s infinite; }

        /* Expanded 3x3 Grid */
        .bento-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }

        .bento-card { background: var(--card-bg); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid var(--card-border); border-radius: 24px; padding: 2rem; display: flex; flex-direction: column; justify-content: space-between; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); opacity: 0; transform: translateY(30px); animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        .bento-card:nth-child(1) { animation-delay: 0.1s; } .bento-card:nth-child(2) { animation-delay: 0.2s; }
        .bento-card:nth-child(3) { animation-delay: 0.3s; } .bento-card:nth-child(4) { animation-delay: 0.4s; }
        .bento-card:nth-child(5) { animation-delay: 0.5s; } .bento-card:nth-child(6) { animation-delay: 0.6s; }
        .bento-card:nth-child(7) { animation-delay: 0.7s; } .bento-card:nth-child(8) { animation-delay: 0.8s; }
        .bento-card:nth-child(9) { animation-delay: 0.9s; }

        .bento-card:hover { transform: translateY(-8px) scale(1.02); background: rgba(15, 18, 25, 0.85); border-color: rgba(255, 255, 255, 0.25); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }

        .metric-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .metric-title { font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.1em; }
        
        .metric-data { display: flex; align-items: baseline; gap: 0.5rem; }
        .metric-value { font-size: 3.5rem; font-weight: 800; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; text-shadow: 0 2px 15px rgba(0,0,0,0.4); }
        .metric-unit { font-size: 1.2rem; font-weight: 600; color: var(--text-secondary); }

        /* Color Coding */
        .c-temp { color: #ff6b6b; } .c-hum { color: #4facfe; } .c-pres { color: #00f2fe; }
        .c-aq { color: #a18cd1; transition: color 0.4s ease; } .c-gas { color: #f6d365; } .c-rain { color: #43e97b; }
        .c-wind { color: #fdfbfb; } .c-feel { color: #ff9a9e; } .c-chill { color: #a1c4fd; }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
    </style>
</head>
<body>
    <canvas id="skyCanvas"></canvas>

    <div class="content-wrapper">
        <div class="sky-banner" id="skyBanner">
            <h1 id="timeGreeting">Atmosphere OS</h1>
            <p><span class="ping"></span> Live AWS Telemetry Stream</p>
        </div>

        <div class="bento-grid">
            <div class="bento-card"><div class="metric-header"><span class="metric-title">Temperature</span><span>🌡️</span></div><div class="metric-data"><span class="metric-value c-temp" id="val-temp" data-val="0">0</span><span class="metric-unit">°C</span></div></div>
            <div class="bento-card"><div class="metric-header"><span class="metric-title">Humidity</span><span>💧</span></div><div class="metric-data"><span class="metric-value c-hum" id="val-hum" data-val="0">0</span><span class="metric-unit">%</span></div></div>
            <div class="bento-card"><div class="metric-header"><span class="metric-title">Pressure</span><span>🌪️</span></div><div class="metric-data"><span class="metric-value c-pres" id="val-pres" data-val="0">0</span><span class="metric-unit">hPa</span></div></div>

            <div class="bento-card" id="aqi-card" style="transition: border-bottom 0.4s ease;">
                <div class="metric-header">
                    <span class="metric-title">Air Quality</span><span>🌫️</span>
                </div>
                <div class="metric-data" style="display: flex; flex-direction: column; align-items: flex-start; gap: 0.2rem;">
                    <div>
                        <span class="metric-value c-aq" id="val-aq" data-val="0">0</span>
                        <span class="metric-unit">AQI</span>
                    </div>
                    <span id="val-aq-label" style="font-size: 1.05rem; font-weight: 700; color: #a18cd1; transition: color 0.4s ease;">Analyzing...</span>
                </div>
            </div>

            <div class="bento-card"><div class="metric-header"><span class="metric-title">Combustible Gas Risk</span><span>⚠️</span></div><div class="metric-data"><span class="metric-value c-gas" id="val-gas" data-val="0">0</span><span class="metric-unit">%</span></div></div>
            <div class="bento-card"><div class="metric-header"><span class="metric-title">Rain Probability</span><span>☔</span></div><div class="metric-data"><span class="metric-value c-rain" id="val-rain" data-val="0">0</span><span class="metric-unit">%</span></div></div>

            <div class="bento-card"><div class="metric-header"><span class="metric-title">Wind Speed</span><span>💨</span></div><div class="metric-data"><span class="metric-value c-wind" id="val-wind" data-val="0">0</span><span class="metric-unit">km/h</span></div></div>
            <div class="bento-card"><div class="metric-header"><span class="metric-title">Feels Like</span><span>👕</span></div><div class="metric-data"><span class="metric-value c-feel" id="val-feel" data-val="0">0</span><span class="metric-unit">°C</span></div></div>
            <div class="bento-card"><div class="metric-header"><span class="metric-title">Wind Chill</span><span>❄️</span></div><div class="metric-data"><span class="metric-value c-chill" id="val-chill" data-val="0">0</span><span class="metric-unit">°C</span></div></div>
        </div>
    </div>

    <script>
    // 1. YOUR API LINK
    const apiEndpoint = 'https://1w7vf8sbbg.execute-api.ap-south-1.amazonaws.com/weather'; 

    // --- 1. FULL-SCREEN LIVE CANVAS ENGINE ---
    function initSkyEngine() {
        const canvas = document.getElementById('skyCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        window.addEventListener('resize', () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });
        const stars = Array.from({length: 200}, () => ({ x: Math.random() * width, y: Math.random() * height, r: Math.random() * 1.5, alpha: Math.random(), speed: (Math.random() * 0.02) + 0.005 }));
        const clouds = Array.from({length: 6}, () => ({ x: Math.random() * width, y: (Math.random() * height * 0.4), speed: (Math.random() * 0.4) + 0.1, size: (Math.random() * 30) + 20 }));

        function draw() {
            ctx.clearRect(0, 0, width, height);
            const hour = new Date().getHours();
            if (hour < 5 || hour >= 20) {
                stars.forEach(s => { ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill(); s.alpha += s.speed; if(s.alpha >= 1 || s.alpha <= 0) s.speed *= -1; });
                ctx.fillStyle = 'rgba(255, 255, 240, 0.9)'; ctx.shadowBlur = 40; ctx.shadowColor = 'rgba(255, 255, 240, 0.3)'; ctx.beginPath(); ctx.arc(width * 0.8, height * 0.2, 40, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
            } else if (hour >= 8 && hour < 17) {
                ctx.fillStyle = 'rgba(255, 225, 120, 1)'; ctx.shadowBlur = 80; ctx.shadowColor = 'rgba(255, 200, 50, 0.5)'; ctx.beginPath(); ctx.arc(width * 0.8, height * 0.2, 60, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)'; clouds.forEach(c => { ctx.beginPath(); ctx.arc(c.x, c.y, c.size, 0, Math.PI*2); ctx.arc(c.x + c.size*1.2, c.y - c.size*0.3, c.size*1.2, 0, Math.PI*2); ctx.arc(c.x + c.size*2.2, c.y, c.size*0.9, 0, Math.PI*2); ctx.fill(); c.x += c.speed; if(c.x > width + 100) c.x = -150; });
            } else {
                ctx.fillStyle = 'rgba(255, 100, 40, 0.95)'; ctx.shadowBlur = 100; ctx.shadowColor = 'rgba(255, 80, 0, 0.6)'; ctx.beginPath(); ctx.arc(width * 0.5, height * 0.85, 80, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
            }
            requestAnimationFrame(draw);
        }
        draw();
    }

    function updateSkyTheme() {
        const hour = new Date().getHours(); const body = document.body; const greeting = document.getElementById('timeGreeting');
        if (hour >= 5 && hour < 8) { body.style.background = "var(--sky-dawn)"; greeting.innerText = "Dawn Protocol 🌅"; } 
        else if (hour >= 8 && hour < 17) { body.style.background = "var(--sky-day)"; greeting.innerText = "Active Daytime ☀️"; } 
        else if (hour >= 17 && hour < 20) { body.style.background = "var(--sky-dusk)"; greeting.innerText = "Dusk Sequence 🌇"; } 
        else { body.style.background = "var(--sky-night)"; greeting.innerText = "Night Watch 🌙"; }
    }

    function calculateDerivedMetrics(temp, hum, pres, windSpeed, rawAq) {
        const feelsLike = temp + 0.33 * (hum / 100 * 6.105 * Math.exp(17.27 * temp / (237.7 + temp))) - 4.00;
        let rainChance = 0;
        if (pres > 0) { const pressureFactor = Math.max(0, (914 - pres) * 3.5); const humidityFactor = hum > 60 ? (hum - 60) * 1.5 : 0; rainChance = Math.min(100, pressureFactor + humidityFactor); }
        let windChill = temp;
        if (temp <= 10 && windSpeed > 4.8) { windChill = 13.12 + 0.6215 * temp - 11.37 * Math.pow(windSpeed, 0.16) + 0.3965 * temp * Math.pow(windSpeed, 0.16); }
        let gasRisk = Math.max(0, Math.min(100, ((rawAq - 500) / 3000) * 100));
        return { feelsLike: feelsLike, rainChance: rainChance, windChill: windChill, gasRisk: gasRisk };
    }

    // --- NEW: THE ANIMATION ENGINE ---
    function animateValue(obj, start, end, duration, isFloat) {
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            
            // Easing function (easeOutQuart) for a smooth fast-to-slow spin
            const easeProgress = 1 - Math.pow(1 - progress, 4);
            const currentVal = start + (end - start) * easeProgress;
            
            if (isFloat) {
                obj.innerText = currentVal.toFixed(1);
            } else {
                obj.innerText = Math.round(currentVal);
            }
            
            if (progress < 1) {
                window.requestAnimationFrame(step);
            } else {
                // Lock exact final value
                obj.innerText = isFloat ? end.toFixed(1) : Math.round(end);
            }
        };
        window.requestAnimationFrame(step);
    }

    function forceUpdate(id, targetValue, isFloat = false) {
        try {
            const obj = document.getElementById(id);
            const startValue = parseFloat(obj.getAttribute('data-val')) || 0;
            
            if (startValue !== targetValue) {
                animateValue(obj, startValue, targetValue, 1500, isFloat); // 1.5 second animation
                obj.setAttribute('data-val', targetValue); // Save new value for next time
            }
        } catch (e) { console.error("Failed to update card: " + id, e); }
    }

    // --- AWS DECODERS ---
    function getAwsVal(field) {
        if (field === null || field === undefined) return 0;
        if (typeof field === 'object') { return Number(field.N || field.S) || 0; }
        return Number(field) || 0;
    }

    function getAwsTime(field) {
        if (!field) return 0;
        let val = typeof field === 'object' ? (field.N || field.S) : field;
        if (!isNaN(val)) return Number(val);
        return new Date(val).getTime() || 0;
    }

    function findTime(obj) {
        if (obj.timestamp) return getAwsTime(obj.timestamp);
        if (obj.Time) return getAwsTime(obj.Time);
        if (obj.time) return getAwsTime(obj.time);
        if (obj.Date) return getAwsTime(obj.Date);
        if (obj.date) return getAwsTime(obj.date);
        if (obj.id) return getAwsTime(obj.id); 
        
        for (let key in obj) {
            if (key.toLowerCase().includes('time') || key.toLowerCase().includes('date')) {
                return getAwsTime(obj[key]);
            }
        }
        return 0; 
    }

    // --- THE UPGRADED AQI BLENDER (With Hardware Calibration) ---
    function formatAQI(rawSensorValue) {
        // 1. HARDWARE CALIBRATION SETTINGS
        const cleanAirRaw = 1000; // Your room's normal baseline
        const toxicAirRaw = 4095; // The max value the ESP32 can output 

        // 2. THE MAPPING ALGORITHM
        // Squishes your 1000-4095 range into the official 0-500 scale.
        // We add '+ 25' at the end so perfect air reads as '25' instead of an unrealistic '0'.
        let calculatedAQI = (((rawSensorValue - cleanAirRaw) / (toxicAirRaw - cleanAirRaw)) * 475) + 25;

        // 3. SAFETY CLAMPS
        // If the room gets extra clean (e.g., raw drops to 850), this stops the math from going into negative numbers.
        let standardAQI = Math.max(0, Math.round(calculatedAQI));

        // 4. THE OFFICIAL EPA SCALE
        let aqiCategory = ""; let aqiColor = "";

        if (standardAQI <= 50) { aqiCategory = "Good 🟢"; aqiColor = "#00E400"; } 
        else if (standardAQI <= 100) { aqiCategory = "Moderate 🟡"; aqiColor = "#FFFF00"; } 
        else if (standardAQI <= 150) { aqiCategory = "Unhealthy for Sensitive Groups 🟠"; aqiColor = "#FF7E00"; } 
        else if (standardAQI <= 200) { aqiCategory = "Unhealthy 🔴"; aqiColor = "#FF0000"; } 
        else if (standardAQI <= 300) { aqiCategory = "Very Unhealthy 🟣"; aqiColor = "#8F3F97"; } 
        else { standardAQI = Math.min(standardAQI, 500); aqiCategory = "Hazardous 🟤"; aqiColor = "#7E0023"; }

        return { number: standardAQI, label: aqiCategory, color: aqiColor };
    }

    // --- FETCH ENGINE ---
    async function fetchWeatherData() {
        try {
            const bypassCacheUrl = apiEndpoint + (apiEndpoint.includes('?') ? '&' : '?') + 't=' + new Date().getTime();
            const response = await fetch(bypassCacheUrl, { cache: 'no-store' });
            if (!response.ok) throw new Error("Gateway Offline");
            
            const rawData = await response.json();
            
            let dataArray = [];
            if (rawData.Items) dataArray = rawData.Items;
            else if (rawData.body) dataArray = JSON.parse(rawData.body);
            else if (Array.isArray(rawData)) dataArray = rawData;
            else dataArray = [rawData]; 

            if (dataArray.length === 0) return;

            dataArray.sort((a, b) => findTime(b) - findTime(a));
            const latest = dataArray[0];

            console.log("🔥 UNWRAPPED NEWEST DATA:", latest);

            const temp = getAwsVal(latest.temperature);
            const hum = getAwsVal(latest.humidity);
            const pres = getAwsVal(latest.pressure);
            const aq = getAwsVal(latest.airQuality);
            const wind = getAwsVal(latest.windSpeed);

            const derived = calculateDerivedMetrics(temp, hum, pres, wind, aq);

            // Animated Updates!
            forceUpdate('val-temp', temp, true);
            forceUpdate('val-hum', hum, true);
            forceUpdate('val-pres', pres, false);
            forceUpdate('val-gas', derived.gasRisk, false);
            forceUpdate('val-rain', derived.rainChance, false);
            forceUpdate('val-wind', wind, true);
            forceUpdate('val-feel', derived.feelsLike, true);
            forceUpdate('val-chill', derived.windChill, true);

            // Animated AQI Filter
            let formattedAQI = formatAQI(aq);
            forceUpdate('val-aq', formattedAQI.number, false);
            document.getElementById('val-aq-label').innerText = formattedAQI.label;
            
            document.getElementById('val-aq').style.color = formattedAQI.color;
            document.getElementById('val-aq-label').style.color = formattedAQI.color;
            document.getElementById('aqi-card').style.borderBottom = `5px solid ${formattedAQI.color}`;

            document.querySelector('.ping').style.backgroundColor = "#10b981";

        } catch (error) {
            console.error("Pipeline Error:", error);
            document.querySelector('.ping').style.backgroundColor = "red";
        }
    }

    initSkyEngine();
    updateSkyTheme();
    fetchWeatherData();
    setInterval(fetchWeatherData, 10000); 
    </script>
</body>
</html>
