<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmosphere OS | Live Telemetry</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: rgba(20, 20, 25, 0.6);
            --card-border: rgba(255, 255, 255, 0.05);
            --text-primary: #ffffff;
            --text-secondary: #8892b0;
            --accent: #00f2fe;
            
            /* Dynamic Sky Gradients */
            --sky-dawn: linear-gradient(135deg, #f39c12, #d35400, #2c3e50);
            --sky-day: linear-gradient(135deg, #1cc4f2, #0072ff);
            --sky-dusk: linear-gradient(135deg, #2c3e50, #fd746c);
            --sky-night: linear-gradient(135deg, #090a0f, #10121a, #1a1c23);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); min-height: 100vh; padding: 2rem; display: flex; justify-content: center; align-items: center; }

        .container { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 2rem; }

        /* Dynamic Sky Banner */
        .sky-banner {
            border-radius: 24px; padding: 3rem; position: relative; overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); transition: background 2s ease;
            animation: fadeDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        /* The Live Canvas Engine */
        #skyCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }

        .sky-banner::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(5,5,5,0.8), transparent); z-index: 1;
        }
        .sky-banner-content { position: relative; z-index: 2; }
        .sky-banner h1 { font-size: 3rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.5rem; }
        .sky-banner p { color: #a1a1aa; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        
        /* Live Ping Dot */
        .ping { width: 10px; height: 10px; background-color: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981; animation: pulse 2s infinite; }

        /* Bento Grid */
        .bento-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem;
        }

        .bento-card {
            background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border); border-radius: 24px; padding: 2rem;
            display: flex; flex-direction: column; justify-content: space-between;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0; transform: translateY(30px);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .bento-card:nth-child(1) { animation-delay: 0.1s; }
        .bento-card:nth-child(2) { animation-delay: 0.2s; }
        .bento-card:nth-child(3) { animation-delay: 0.3s; }
        .bento-card:nth-child(4) { animation-delay: 0.4s; }
        .bento-card:nth-child(5) { animation-delay: 0.5s; }
        .bento-card:nth-child(6) { animation-delay: 0.6s; }

        .bento-card:hover { transform: translateY(-8px) scale(1.02); background: rgba(30, 30, 38, 0.8); border-color: rgba(255, 255, 255, 0.15); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }

        .metric-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .metric-title { font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.1em; }
        
        .metric-data { display: flex; align-items: baseline; gap: 0.5rem; }
        .metric-value { font-size: 3.5rem; font-weight: 800; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
        .metric-unit { font-size: 1.2rem; font-weight: 600; color: var(--text-secondary); }

        /* Specific Colors */
        .c-temp { color: #ff6b6b; } .c-hum { color: #4facfe; } .c-pres { color: #00f2fe; }
        .c-aq { color: #a18cd1; } .c-feel { color: #ff9a9e; } .c-rain { color: #43e97b; }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
    </style>
</head>
<body>

    <div class="container">
        <div class="sky-banner" id="skyBanner">
            <canvas id="skyCanvas"></canvas>
            <div class="sky-banner-content">
                <h1 id="timeGreeting">Atmosphere OS</h1>
                <p><span class="ping"></span> Live AWS Telemetry Stream</p>
            </div>
        </div>

        <div class="bento-grid">
            <div class="bento-card">
                <div class="metric-header"><span class="metric-title">Temperature</span><span>🌡️</span></div>
                <div class="metric-data"><span class="metric-value c-temp" id="val-temp">0</span><span class="metric-unit">°C</span></div>
            </div>
            
            <div class="bento-card">
                <div class="metric-header"><span class="metric-title">Humidity</span><span>💧</span></div>
                <div class="metric-data"><span class="metric-value c-hum" id="val-hum">0</span><span class="metric-unit">%</span></div>
            </div>

            <div class="bento-card">
                <div class="metric-header"><span class="metric-title">Barometric Pressure</span><span>🌪️</span></div>
                <div class="metric-data"><span class="metric-value c-pres" id="val-pres">0</span><span class="metric-unit">hPa</span></div>
            </div>

            <div class="bento-card">
                <div class="metric-header"><span class="metric-title">Air Quality (Raw)</span><span>🌫️</span></div>
                <div class="metric-data"><span class="metric-value c-aq" id="val-aq">0</span><span class="metric-unit">Idx</span></div>
            </div>

            <div class="bento-card">
                <div class="metric-header"><span class="metric-title">Feels Like</span><span>👕</span></div>
                <div class="metric-data"><span class="metric-value c-feel" id="val-feel">0</span><span class="metric-unit">°C</span></div>
            </div>

            <div class="bento-card">
                <div class="metric-header"><span class="metric-title">Rain Probability</span><span>☔</span></div>
                <div class="metric-data"><span class="metric-value c-rain" id="val-rain">0</span><span class="metric-unit">%</span></div>
            </div>
        </div>
    </div>

    <script>
        const apiEndpoint = 'https://1w7vf8sbbg.execute-api.ap-south-1.amazonaws.com/weather';

        // --- 1. LIVE SKY CANVAS ENGINE ---
        function initSkyEngine() {
            const canvas = document.getElementById('skyCanvas');
            const ctx = canvas.getContext('2d');
            
            // Match canvas to banner size
            let width = canvas.width = canvas.offsetWidth;
            let height = canvas.height = canvas.offsetHeight;

            window.addEventListener('resize', () => {
                width = canvas.width = canvas.offsetWidth;
                height = canvas.height = canvas.offsetHeight;
            });

            // Pre-generate stars for night
            const stars = Array.from({length: 120}, () => ({
                x: Math.random() * width,
                y: Math.random() * height,
                r: Math.random() * 1.5,
                alpha: Math.random(),
                speed: (Math.random() * 0.02) + 0.005
            }));

            // Pre-generate clouds for day
            const clouds = Array.from({length: 4}, () => ({
                x: Math.random() * width,
                y: (Math.random() * height * 0.4) + 10,
                speed: (Math.random() * 0.3) + 0.1,
                size: (Math.random() * 20) + 15
            }));

            function draw() {
                ctx.clearRect(0, 0, width, height);
                const hour = new Date().getHours();

                if (hour < 5 || hour >= 20) {
                    // NIGHT TIME: Twinkling Stars & Moon
                    stars.forEach(s => {
                        ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
                        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
                        s.alpha += s.speed;
                        if(s.alpha >= 1 || s.alpha <= 0) s.speed *= -1; // Twinkle effect
                    });
                    
                    // Moon
                    ctx.fillStyle = 'rgba(255, 255, 240, 0.9)';
                    ctx.shadowBlur = 30; ctx.shadowColor = 'rgba(255, 255, 240, 0.4)';
                    ctx.beginPath(); ctx.arc(width * 0.85, height * 0.4, 25, 0, Math.PI*2); ctx.fill();
                    ctx.shadowBlur = 0;

                } else if (hour >= 8 && hour < 17) {
                    // DAY TIME: Bright Sun & Drifting Clouds
                    ctx.fillStyle = 'rgba(255, 225, 120, 1)';
                    ctx.shadowBlur = 50; ctx.shadowColor = 'rgba(255, 200, 50, 0.6)';
                    ctx.beginPath(); ctx.arc(width * 0.8, height * 0.3, 40, 0, Math.PI*2); ctx.fill();
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                    clouds.forEach(c => {
                        ctx.beginPath(); 
                        ctx.arc(c.x, c.y, c.size, 0, Math.PI*2);
                        ctx.arc(c.x + c.size*1.2, c.y - c.size*0.3, c.size*1.2, 0, Math.PI*2);
                        ctx.arc(c.x + c.size*2.2, c.y, c.size*0.9, 0, Math.PI*2);
                        ctx.fill();
                        c.x += c.speed;
                        if(c.x > width + 50) c.x = -100; // Reset cloud to left side
                    });
                } else {
                    // DAWN / DUSK: Horizon Sun
                    ctx.fillStyle = 'rgba(255, 120, 50, 0.9)';
                    ctx.shadowBlur = 60; ctx.shadowColor = 'rgba(255, 80, 0, 0.5)';
                    ctx.beginPath(); ctx.arc(width * 0.5, height * 0.8, 45, 0, Math.PI*2); ctx.fill();
                    ctx.shadowBlur = 0;
                }
                requestAnimationFrame(draw);
            }
            draw();
        }

        // --- 2. AWS DATA PIPELINE ---
        let currentValues = { temp: 0, hum: 0, pres: 0, aq: 0, feel: 0, rain: 0 };

        function animateValue(id, key, endValue, isFloat = false) {
            const obj = document.getElementById(id);
            const startValue = currentValues[key];
            if (startValue === endValue) return;

            const duration = 1000; 
            const startTime = performance.now();

            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3);
                const current = startValue + (endValue - startValue) * easeOut;

                obj.innerText = isFloat ? current.toFixed(1) : Math.round(current);

                if (progress < 1) { requestAnimationFrame(update); } 
                else { currentValues[key] = endValue; }
            }
            requestAnimationFrame(update);
        }

        function updateSkyTheme() {
            const hour = new Date().getHours();
            const banner = document.getElementById('skyBanner');
            const greeting = document.getElementById('timeGreeting');

            if (hour >= 5 && hour < 8) { banner.style.background = "var(--sky-dawn)"; greeting.innerText = "Dawn Protocol 🌅"; } 
            else if (hour >= 8 && hour < 17) { banner.style.background = "var(--sky-day)"; greeting.innerText = "Active Daytime ☀️"; } 
            else if (hour >= 17 && hour < 20) { banner.style.background = "var(--sky-dusk)"; greeting.innerText = "Dusk Sequence 🌇"; } 
            else { banner.style.background = "var(--sky-night)"; greeting.innerText = "Night Watch 🌙"; }
        }

        function calculateDerivedMetrics(temp, hum, pres) {
            const feelsLike = temp + 0.33 * (hum / 100 * 6.105 * Math.exp(17.27 * temp / (237.7 + temp))) - 4.00;
            let rainChance = 0;
            if (pres > 0) { 
                const pressureFactor = Math.max(0, (914 - pres) * 3.5); 
                const humidityFactor = hum > 60 ? (hum - 60) * 1.5 : 0; 
                rainChance = Math.min(100, pressureFactor + humidityFactor); 
            }
            return { feelsLike: feelsLike, rainChance: rainChance };
        }

        async function fetchWeatherData() {
            try {
                const response = await fetch(apiEndpoint);
                if (!response.ok) throw new Error("Gateway Offline");
                
                const data = await response.json();
                const latest = data.reduce((prev, current) => (prev.timestamp > current.timestamp) ? prev : current);
                const derived = calculateDerivedMetrics(latest.temperature, latest.humidity, latest.pressure);

                animateValue('val-temp', 'temp', latest.temperature, true);
                animateValue('val-hum', 'hum', latest.humidity, true);
                animateValue('val-pres', 'pres', latest.pressure, false);
                animateValue('val-aq', 'aq', latest.airQuality, false);
                animateValue('val-feel', 'feel', derived.feelsLike, true);
                animateValue('val-rain', 'rain', derived.rainChance, false);

            } catch (error) {
                console.error("Pipeline Error:", error);
                document.getElementById('timeGreeting').innerText = "SYSTEM OFFLINE";
                document.querySelector('.ping').style.backgroundColor = "red";
            }
        }

        // --- 3. BOOT SEQUENCE ---
        initSkyEngine();
        updateSkyTheme();
        fetchWeatherData();
        setInterval(fetchWeatherData, 10000); 
    </script>
</body>
</html>
