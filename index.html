<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmosphere OS | Premium Weather Station</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: rgba(31, 38, 52, 0.4);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            
            /* Dynamic Sky Gradients */
            --sky-dawn: linear-gradient(135deg, #f39c12, #d35400, #2c3e50);
            --sky-day: linear-gradient(135deg, #1cc4f2, #0072ff);
            --sky-dusk: linear-gradient(135deg, #2c3e50, #fd746c);
            --sky-night: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); min-height: 100vh; padding: 2rem 1rem; overflow-x: hidden; }

        .container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }

        /* Dynamic Sky Banner */
        .sky-banner {
            border-radius: 24px;
            padding: 2.5rem;
            text-align: left;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transition: background 1s ease-in-out;
            background: var(--sky-night); /* Fallback */
        }
        .sky-banner::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 80% 20%, rgba(255,255,255,0.15), transparent 40%);
        }
        .sky-banner h1 { font-size: 2.5rem; font-weight: 800; tracking: -0.05em; margin-bottom: 0.5rem; }
        .sky-banner p { color: rgba(255, 255, 255, 0.8); font-size: 1rem; font-weight: 500; }

        /* Real-time Grid */
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; }
        .metric-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .metric-card:hover { transform: translateY(-4px); border-color: rgba(255, 255, 255, 0.15); }
        .metric-label { font-size: 0.875rem; font-weight: 500; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
        .metric-value { font-size: 2.25rem; font-weight: 800; letter-spacing: -0.02em; }
        .metric-unit { font-size: 1.25rem; font-weight: 500; color: var(--text-secondary); }

        /* Custom Accents for values */
        #temp-val { color: #ff6384; }
        #hum-val { color: #36a2eb; }
        #pres-val { color: #4bc0c0; }
        #aq-val { color: #9966ff; }

        /* Chart Canvas Container */
        .chart-container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="sky-banner" id="skyBanner">
            <h1 id="timeGreeting">Atmosphere OS</h1>
            <p id="statusText">Initialising secure cloud stream...</p>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <span class="metric-label">Temperature</span>
                <div><span class="metric-value" id="temp-val">--</span><span class="metric-unit"> °C</span></div>
            </div>
            <div class="metric-card">
                <span class="metric-label">Humidity</span>
                <div><span class="metric-value" id="hum-val">--</span><span class="metric-unit"> %</span></div>
            </div>
            <div class="metric-card">
                <span class="metric-label">Barometric Pressure</span>
                <div><span class="metric-value" id="pres-val">--</span><span class="metric-unit"> hPa</span></div>
            </div>
            <div class="metric-card">
                <span class="metric-label">Air Quality Index</span>
                <div><span class="metric-value" id="aq-val">--</span><span class="metric-unit"> Raw</span></div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="premiumChart"></canvas>
        </div>
    </div>

    <script>
        let weatherChart;
        const apiEndpoint = 'https://1w7vf8sbbg.execute-api.ap-south-1.amazonaws.com/weather';

        // Dynamic Sky Background Engine
        function updateSkyTheme() {
            const hour = new Date().getHours();
            const banner = document.getElementById('skyBanner');
            const greeting = document.getElementById('timeGreeting');

            if (hour >= 5 && hour < 8) {
                banner.style.background = "var(--sky-dawn)";
                greeting.innerText = "Good Morning 🌅";
            } else if (hour >= 8 && hour < 17) {
                banner.style.background = "var(--sky-day)";
                greeting.innerText = "Live Dashboard ☀️";
            } else if (hour >= 17 && hour < 20) {
                banner.style.background = "var(--sky-dusk)";
                greeting.innerText = "Good Evening 🌇";
            } else {
                banner.style.background = "var(--sky-night)";
                greeting.innerText = "Night Watch 🌙";
            }
        }

        async function fetchWeatherData() {
            try {
                const response = await fetch(apiEndpoint);
                if (!response.ok) throw new Error("Gateway Offline");
                
                const data = await response.json();
                document.getElementById('statusText').innerText = "Telemetry synchronous. Updates active every 10s.";

                // Take the absolute latest reading to update our bold metrics grid
                const latest = data[0];
                document.getElementById('temp-val').innerText = latest.temperature ? latest.temperature.toFixed(1) : '--';
                document.getElementById('hum-val').innerText = latest.humidity ? latest.humidity.toFixed(1) : '--';
                document.getElementById('pres-val').innerText = latest.pressure ? Math.round(latest.pressure) : '--';
                document.getElementById('aq-val').innerText = latest.airQuality || '--';

                // Chronological sorting for the graph engine
                const reversedData = data.reverse();
                const labels = reversedData.map(item => {
                    let date = new Date(item.timestamp * 1000);
                    return date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                });
                
                const temps = reversedData.map(item => item.temperature);
                const hums = reversedData.map(item => item.humidity);
                const press = reversedData.map(item => item.pressure);
                const airQuals = reversedData.map(item => item.airQuality);

                drawChart(labels, temps, hums, press, airQuals);

            } catch (error) {
                console.error("Pipeline Error:", error);
                document.getElementById('statusText').innerText = "System Failure: Lost connection to AWS Cloud.";
            }
        }

        function drawChart(labels, temps, hums, press, airQuals) {
            const ctx = document.getElementById('premiumChart').getContext('2d');
            if (weatherChart) { weatherChart.destroy(); }

            // Chart JS Dark Styling configuration
            Chart.defaults.color = '#94a3b8';
            Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.05)';

            weatherChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Temperature (°C)', data: temps, borderColor: '#ff6384', backgroundColor: 'rgba(255, 99, 132, 0.05)', fill: true, yAxisID: 'y', tension: 0.3, borderWidth: 3 },
                        { label: 'Humidity (%)', data: hums, borderColor: '#36a2eb', backgroundColor: 'rgba(54, 162, 235, 0.05)', fill: true, yAxisID: 'y', tension: 0.3, borderWidth: 3 },
                        { label: 'Pressure (hPa)', data: press, borderColor: '#4bc0c0', yAxisID: 'y1', tension: 0.3, borderWidth: 2, borderDash: [5, 5] },
                        { label: 'Air Quality (Raw)', data: airQuals, borderColor: '#9966ff', yAxisID: 'y1', tension: 0.3, borderWidth: 2 }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { position: 'top', labels: { font: { weight: '500' } } } },
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        y: { type: 'linear', display: true, position: 'left', title: { display: true, text: 'Ambient Properties' } },
                        y1: { type: 'linear', display: true, position: 'right', title: { display: true, text: 'Atmospheric Vectors' }, grid: { drawOnChartArea: false } }
                    }
                }
            });
        }

        // Initialize UI Elements
        updateSkyTheme();
        fetchWeatherData();
        setInterval(fetchWeatherData, 10000); // 10-second high-precision refresh cadence
    </script>
</body>
</html>
