<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Live Weather Station</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; color: #333; }
        h1 { margin-top: 20px; }
        .chart-container { width: 80%; max-width: 900px; margin: 30px auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        #statusText { font-style: italic; color: gray; }
    </style>
</head>
<body>

    <h1>Live Weather Data 🌤️</h1>
    <p id="statusText">Fetching data from cloud...</p>

    <div class="chart-container">
        <canvas id="weatherChart"></canvas>
    </div>

    <script>
        let weatherChart; // Variable to hold our chart instance

        async function fetchWeatherData() {
            try {
                // IMPORTANT: Replace the link below with your actual AWS API Gateway link!
                const response = await fetch('https://1w7vf8sbbg.execute-api.ap-south-1.amazonaws.com/weather'); 
                
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }
                
                const data = await response.json();
                document.getElementById('statusText').innerText = "Live data streaming successfully!";

                // Reverse data so the graph reads left-to-right (oldest to newest)
                const reversedData = data.reverse();

                // Extract arrays for the chart
                const labels = reversedData.map(item => {
                    let date = new Date(item.timestamp * 1000);
                    return date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                });
                
                const temperatures = reversedData.map(item => item.temperature);
                const humidities = reversedData.map(item => item.humidity);
                const pressures = reversedData.map(item => item.pressure);
                const airQualities = reversedData.map(item => item.airQuality);

                drawChart(labels, temperatures, humidities, pressures, airQualities);

            } catch (error) {
                console.error("Error connecting to AWS:", error);
                document.getElementById('statusText').innerText = "Error connecting to cloud gateway.";
            }
        }

        function drawChart(labels, temperatures, humidities, pressures, airQualities) {
            const ctx = document.getElementById('weatherChart').getContext('2d');
            
            // Destroy the old chart before drawing a new one to prevent glitching
            if (weatherChart) {
                weatherChart.destroy();
            }

            weatherChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Temperature (°C)',
                            data: temperatures,
                            borderColor: 'rgb(255, 99, 132)',
                            yAxisID: 'y',
                            tension: 0.1
                        },
                        {
                            label: 'Humidity (%)',
                            data: humidities,
                            borderColor: 'rgb(54, 162, 235)',
                            yAxisID: 'y',
                            tension: 0.1
                        },
                        {
                            label: 'Pressure (hPa)',
                            data: pressures,
                            borderColor: 'rgb(75, 192, 192)',
                            yAxisID: 'y1',
                            tension: 0.1
                        },
                        {
                            label: 'Air Quality (Raw)',
                            data: airQualities,
                            borderColor: 'rgb(153, 102, 255)',
                            yAxisID: 'y1',
                            tension: 0.1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    scales: {
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            title: { display: true, text: 'Temp & Humidity' }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            title: { display: true, text: 'Pressure & Air Quality' },
                            grid: { drawOnChartArea: false } // Keeps the background grid clean
                        }
                    }
                }
            });
        }

        // Fetch data immediately when the page loads, then update every 10 seconds
        fetchWeatherData();
        setInterval(fetchWeatherData, 10000);
    </script>
</body>
</html>
