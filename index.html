<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmosphere OS | Live Telemetry</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --card-bg: rgba(10, 12, 18, 0.65); 
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            
            --sky-dawn: linear-gradient(135deg, #1a1a2e, #ff7e5f, #feb47b);
            --sky-day: linear-gradient(135deg, #2980b9, #6dd5fa, #ffffff);
            --sky-dusk: linear-gradient(135deg, #0f2027, #203a43, #ff4e50);
            --sky-night: linear-gradient(135deg, #050505, #0a0a12, #11111a);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { color: var(--text-primary); min-height: 100vh; overflow-x: hidden; transition: background 2s ease-in-out; background: var(--sky-night); }

        #skyCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

        .content-wrapper { position: relative; z-index: 10; width: 100%; max-width: 1100px; margin: 0 auto; padding: 3rem 2rem; display: flex; flex-direction: column; gap: 2rem; }

        .sky-banner { background: var(--card-bg); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid var(--card-border); border-radius: 24px; padding: 3rem; box-shadow: 0 20px 40px rgba(0,0,0,0.3); animation: fadeDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .sky-banner h1 { font-size: 3rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.5rem; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .sky-banner p { color: #cbd5e1; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        
        .ping { width: 10px; height: 10px; background-color: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981; animation: pulse 2s infinite; }

        /* Expanded 3x3 Grid */
        .bento-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }

        .bento-card { background: var(--card-bg); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid var(--card-border); border-radius: 24px; padding: 2rem; display: flex; flex-direction: column; justify-content: space-between; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); opacity: 0; transform: translateY(30px); animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        .bento-card:nth-child(1) { animation-delay: 0.1s; } .bento-card:nth-child(2) { animation-delay: 0.2s; }
        .bento-card:nth-child(3) { animation-delay: 0.3s; } .bento-card:nth-child(4) { animation-delay: 0.4s; }
        .bento-card:nth-child(5) { animation-delay: 0.5s; } .bento-card:nth-child(6) { animation-delay: 0.6s; }
        .bento-card:nth-child(7) { animation-delay: 0.7s; } .bento-card:nth-child(8) { animation-delay: 0.8s; }
        .bento-card:nth-child(9) { animation-delay: 0.9s; }

        .bento-card:hover { transform: translateY(-8px) scale(1.02); background: rgba(15, 18, 25, 0.85); border-color: rgba(255, 255, 255, 0.25); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }

        .metric-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .metric-title { font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.1em; }
        
        .metric-data { display: flex; align-items: baseline; gap: 0.5rem; }
        .metric-value { font-size: 3.5rem; font-weight: 800; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; text-shadow: 0 2px 15px rgba(0,0,0,0.4); }
        .metric-unit { font-size: 1.2rem; font-weight: 600; color: var(--text-secondary); }

        /* Color Coding */
        .c-temp { color: #ff6b6b; } .c-hum { color: #4facfe; } .c-pres { color: #00f2fe; }
        .c-aq { color: #a18cd1; } .c-gas { color: #f6d365; } .c-rain { color: #43e97b; }
        .c-wind { color: #fdfbfb; } .c-feel { color: #ff9a9e; } .c-chill { color: #a1c4fd; }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
    </style>
</head>
<body>
    <canvas id="skyCanvas"></canvas>

    <div class="content-wrapper">
        <div class="sky-banner" id="skyBanner">
            <h1 id="timeGreeting">Atmosphere OS</h1>
            <p><span class="ping"></span> Live AWS Telemetry Stream</p>
        </div>

        <div class="bento-grid">
            <div class="bento-card"><div class="metric-header"><span class="metric-title">Temperature</span><span>🌡️</span></div><div class="metric-data"><span class="metric-value c-temp" id="val-temp">0</span><span class="metric-unit">°C</span></div></div>
            <div class="bento-card"><div class="metric-header"><span class="metric-title">Humidity</span><span>💧</span></div><div class="metric-data"><span class="metric-value c-hum" id="val-hum">0</span><span class="metric-unit">%</span></div></div>
            <div class="bento-card"><div class="metric-header"><span class="metric-title">Pressure</span><span>🌪️</span></div><div class="metric-data"><span class="metric-value c-pres" id="val-pres">0</span><span class="metric-unit">hPa</span></div></div>

            <div class="bento-card"><div class="metric-header"><span class="metric-title">Air Quality (Raw)</span><span>🌫️</span></div><div class="metric-data"><span class="metric-value c-aq" id="val-aq">0</span><span class="metric-unit">Idx</span></div></div>
            <div class="bento-card"><div class="metric-header"><span class="metric-title">Combustible Gas Risk</span><span>⚠️</span></div><div class="metric-data"><span class="metric-value c-gas" id="val-gas">0</span><span class="metric-unit">%</span></div></div>
            <div class="bento-card"><div class="metric-header"><span class="metric-title">Rain Probability</span><span>☔</span></div><div class="metric-data"><span class="metric-value c-rain" id="val-rain">0</span><span class="metric-unit">%</span></div></div>

            <div class="bento-card"><div class="metric-header"><span class="metric-title">Wind Speed</span><span>💨</span></div><div class="metric-data"><span class="metric-value c-wind" id="val-wind">0</span><span class="metric-unit">km/h</span></div></div>
            <div class="bento-card"><div class="metric-header"><span class="metric-title">Feels Like</span><span>👕</span></div><div class="metric-data"><span class="metric-value c-feel" id="val-feel">0</span><span class="metric-unit">°C</span></div></div>
            <div class="bento-card"><div class="metric-header"><span class="metric-title">Wind Chill</span><span>❄️</span></div><div class="metric-data"><span class="metric-value c-chill" id="val-chill">0</span><span class="metric-unit">°C</span></div></div>
        </div>
    </div>

    <script>
        const apiEndpoint = 'https://1w7vf8sbbg.execute-api.ap-south-1.amazonaws.com/weather'; // <-- PASTE LINK HERE

        // --- 1. FULL-SCREEN LIVE CANVAS ENGINE ---
        function initSkyEngine() {
            const canvas = document.getElementById('skyCanvas');
            const ctx = canvas.getContext('2d');
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });

            const stars = Array.from({length: 200}, () => ({ x: Math.random() * width, y: Math.random() * height, r: Math.random() * 1.5, alpha: Math.random(), speed: (Math.random() * 0.02) + 0.005 }));
            const clouds = Array.from({length: 6}, () => ({ x: Math.random() * width, y: (Math.random() * height * 0.4), speed: (Math.random() * 0.4) + 0.1, size: (Math.random() * 30) + 20 }));

            function draw() {
                ctx.clearRect(0, 0, width, height);
                const hour = new Date().getHours();

                if (hour < 5 || hour >= 20) {
                    stars.forEach(s => { ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill(); s.alpha += s.speed; if(s.alpha >= 1 || s.alpha <= 0) s.speed *= -1; });
                    ctx.fillStyle = 'rgba(255, 255, 240, 0.9)'; ctx.shadowBlur = 40; ctx.shadowColor = 'rgba(255, 255, 240, 0.3)'; ctx.beginPath(); ctx.arc(width * 0.8, height * 0.2, 40, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
                } else if (hour >= 8 && hour < 17) {
                    ctx.fillStyle = 'rgba(255, 225, 120, 1)'; ctx.shadowBlur = 80; ctx.shadowColor = 'rgba(255, 200, 50, 0.5)'; ctx.beginPath(); ctx.arc(width * 0.8, height * 0.2, 60, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)'; clouds.forEach(c => { ctx.beginPath(); ctx.arc(c.x, c.y, c.size, 0, Math.PI*2); ctx.arc(c.x + c.size*1.2, c.y - c.size*0.3, c.size*1.2, 0, Math.PI*2); ctx.arc(c.x + c.size*2.2, c.y, c.size*0.9, 0, Math.PI*2); ctx.fill(); c.x += c.speed; if(c.x > width + 100) c.x = -150; });
                } else {
                    ctx.fillStyle = 'rgba(255, 100, 40, 0.95)'; ctx.shadowBlur = 100; ctx.shadowColor = 'rgba(255, 80, 0, 0.6)'; ctx.beginPath(); ctx.arc(width * 0.5, height * 0.85, 80, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
                }
                requestAnimationFrame(draw);
            }
            draw();
        }

        // --- 2. AWS DATA PIPELINE & MATH ENGINE ---
        let currentValues = { temp: 0, hum: 0, pres: 0, aq: 0, gas: 0, rain: 0, wind: 0, feel: 0, chill: 0 };

        function animateValue(id, key, endValue, isFloat = false) {
            const obj = document.getElementById(id);
            const startValue = currentValues[key];
            if (startValue === endValue) return;
            const duration = 1000; const startTime = performance.now();
            function update(currentTime) {
                const progress = Math.min((currentTime - startTime) / duration, 1);
                const current = startValue + (endValue - startValue) * (1 - Math.pow(1 - progress, 3));
                obj.innerText = isFloat ? current.toFixed(1) : Math.round(current);
                if (progress < 1) { requestAnimationFrame(update); } else { currentValues[key] = endValue; }
            }
            requestAnimationFrame(update);
        }

        function updateSkyTheme() {
            const hour = new Date().getHours(); const body = document.body; const greeting = document.getElementById('timeGreeting');
            if (hour >= 5 && hour < 8) { body.style.background = "var(--sky-dawn)"; greeting.innerText = "Dawn Protocol 🌅"; } 
            else if (hour >= 8 && hour < 17) { body.style.background = "var(--sky-day)"; greeting.innerText = "Active Daytime ☀️"; } 
            else if (hour >= 17 && hour < 20) { body.style.background = "var(--sky-dusk)"; greeting.innerText = "Dusk Sequence 🌇"; } 
            else { body.style.background = "var(--sky-night)"; greeting.innerText = "Night Watch 🌙"; }
        }

        function calculateDerivedMetrics(temp, hum, pres, windSpeed, rawAq) {
            const feelsLike = temp + 0.33 * (hum / 100 * 6.105 * Math.exp(17.27 * temp / (237.7 + temp))) - 4.00;
            
            let rainChance = 0;
            if (pres > 0) { const pressureFactor = Math.max(0, (914 - pres) * 3.5); const humidityFactor = hum > 60 ? (hum - 60) * 1.5 : 0; rainChance = Math.min(100, pressureFactor + humidityFactor); }
            
            // Wind Chill Formula (Only active <= 10C and wind > 4.8 km/h)
            let windChill = temp;
            if (temp <= 10 && windSpeed > 4.8) {
                windChill = 13.12 + 0.6215 * temp - 11.37 * Math.pow(windSpeed, 0.16) + 0.3965 * temp * Math.pow(windSpeed, 0.16);
            }

            // Combustible Gas Risk (Assuming ~500 is clean, ~3500 is toxic)
            let gasRisk = Math.max(0, Math.min(100, ((rawAq - 500) / 3000) * 100));

            return { feelsLike: feelsLike, rainChance: rainChance, windChill: windChill, gasRisk: gasRisk };
        }

        async function fetchWeatherData() {
            try {
                const response = await fetch(apiEndpoint);
                if (!response.ok) throw new Error("Gateway Offline");
                
                const data = await response.json();
                const latest = data.reduce((prev, current) => (prev.timestamp > current.timestamp) ? prev : current);
                
                // Set default to 0 if windSpeed doesn't exist yet in the database
                const wind = latest.windSpeed || 0; 
                
                const derived = calculateDerivedMetrics(latest.temperature, latest.humidity, latest.pressure, wind, latest.airQuality);

                animateValue('val-temp', 'temp', latest.temperature, true);
                animateValue('val-hum', 'hum', latest.humidity, true);
                animateValue('val-pres', 'pres', latest.pressure, false);
                animateValue('val-aq', 'aq', latest.airQuality, false);
                animateValue('val-gas', 'gas', derived.gasRisk, false);
                animateValue('val-rain', 'rain', derived.rainChance, false);
                animateValue('val-wind', 'wind', wind, true);
                animateValue('val-feel', 'feel', derived.feelsLike, true);
                animateValue('val-chill', 'chill', derived.windChill, true);

            } catch (error) {
                console.error("Pipeline Error:", error);
                document.getElementById('timeGreeting').innerText = "SYSTEM OFFLINE";
                document.querySelector('.ping').style.backgroundColor = "red";
            }
        }

        // --- 3. BOOT SEQUENCE ---
        initSkyEngine();
        updateSkyTheme();
        fetchWeatherData();
        setInterval(fetchWeatherData, 10000); 
    </script>
</body>
</html>
